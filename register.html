<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Activity Portal | Register</title>
</head>
<body bgcolor="#eef3f7" text="#1f2937">
    <table width="100%" border="0" cellpadding="0" cellspacing="0">
        <tr>
            <td bgcolor="#102a43" align="center" height="80">
                <font color="#ffffff" size="6" face="Arial, Helvetica, sans-serif"><b>Student Activity Portal</b></font>
            </td>
        </tr>
        <tr>
            <td bgcolor="#dfeaf7" align="center" height="50">
                <table border="0" cellpadding="8" cellspacing="10">
                    <tr>
                        <td><a href="index.html"><font face="Arial" color="#102a43"><b>Home</b></font></a></td>
                        <td><a href="activities.html"><font face="Arial" color="#102a43"><b>Activities</b></font></a></td>
                        <td><a href="events.html"><font face="Arial" color="#102a43"><b>Events</b></font></a></td>
                        <td><a href="register.html"><font face="Arial" color="#102a43"><b>Register</b></font></a></td>
                        <td><a href="contact.html"><font face="Arial" color="#102a43"><b>Contact</b></font></a></td>
                    </tr>
                </table>
            </td>
        </tr>
        <tr>
            <td align="center" valign="middle" height="350">
                <table width="70%" border="1" bordercolor="#b7c7d6" cellpadding="20" cellspacing="0" bgcolor="#ffffff">
                    <tr>
                        <td>
                            <font face="Arial, Helvetica, sans-serif" size="5" color="#102a43"><b>Register Your Interest</b></font><br>
                            <font face="Arial, Helvetica, sans-serif" size="2" color="#4b5563">
                                Join clubs, workshops, competitions, and campus events.
                            </font>
                            <hr color="#b7c7d6" size="1">
                            <form action="#" method="post">
                                <table width="100%" border="0" cellpadding="8" cellspacing="0">
                                    <tr>
                                        <td width="35%"><font face="Arial" size="2"><b>Full Name:</b></font></td>
                                        <td><input type="text" name="name" size="35" required></td>
                                    </tr>
                                    <tr>
                                        <td><font face="Arial" size="2"><b>USN:</b></font></td>
                                        <td><input type="text" name="usn" size="35" required></td>
                                    </tr>
                                    <tr>
                                        <td><font face="Arial" size="2"><b>Email:</b></font></td>
                                        <td><input type="email" name="email" size="35" required></td>
                                    </tr>
                                    <tr>
                                        <td><font face="Arial" size="2"><b>Activity:</b></font></td>
                                        <td>
                                            <select name="activity" required>
                                                <option>Club Membership</option>
                                                <option>Workshop</option>
                                                <option>Competition</option>
                                                <option>Leadership Program</option>
                                            </select>
                                        </td>
                                    </tr>
                                    <tr>
                                        <td valign="top"><font face="Arial" size="2"><b>Message:</b></font></td>
                                        <td><textarea name="msg" rows="4" cols="36"></textarea></td>
                                    </tr>
                                    <tr>
                                        <td colspan="2" align="center">
                                            <input type="submit" value="Submit" size="20">
                                        </td>
                                    </tr>
                                </table>
                            </form>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
        <tr>
            <td align="center" bgcolor="#102a43" height="40">
                <font face="Arial" size="2" color="#ffffff">BCA - Web &amp; UX Design</font>
            </td>
        </tr>
    </table>
</body>
</html>
